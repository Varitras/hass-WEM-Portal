# Name and description live in strings.json / translations (services.<name>),
# which is where Home Assistant reads them from and the only way they can be
# translated. Selectors, examples and `required` stay here.
set_expert_parameter:
  fields:
    entityvalue:
      name: Entity value
      description: >-
        Hex parameter ID of YOUR installation, taken from the portal's edit
        dialog URL (entityvalue=...). Installation-specific - do not share
        publicly.
      required: true
      example: "6400000000000000000000000000000000FF"
      selector:
        text:
    value:
      name: Value
      description: New value. Must be one of the options the device offers.
      required: true
      example: 30
      # No min/max/step: expert parameters are not all percentages - there
      # are temperatures, times and curves among them, and the integration's
      # own data model knows half steps (WemDataType.NUMBER_STEP_HALF), which
      # a step of 1 silently blocked. Bounds here would only suggest a
      # precision that does not exist; the real check happens on write, where
      # the value is validated against the option list the device itself
      # offers. `box` keeps a numeric field rather than a slider, which needs
      # a range to make sense.
      selector:
        number:
          mode: box
          step: any
