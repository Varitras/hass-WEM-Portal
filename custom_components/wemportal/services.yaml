# Names and descriptions, of the actions and of their fields, live in
# translations/*.json only: Home Assistant reads them from there, and copies
# kept here drifted from what the dialog showed. Selectors, examples and
# `required` stay here.
set_expert_parameter:
  fields:
    entityvalue:
      required: true
      example: "6400000000000000000000000000000000FF"
      selector:
        text:
    value:
      required: true
      example: 30
      # No min/max/step: expert parameters are not all percentages - there
      # are temperatures, times and curves among them, and the integration's
      # own data model knows half steps (WemDataType.NUMBER_STEP_HALF), which
      # a step of 1 silently blocked. Bounds here would only suggest a
      # precision that does not exist; the real check happens on write, where
      # the value is validated against the option list the device itself
      # offers.
      #
      # A text field rather than a number one: an option beside the scale is
      # named by its word, and a number selector cannot express that. Numbers
      # typed here still arrive as numbers - the schema coerces what parses.
      selector:
        text:
set_holiday:
  fields:
    begin_entity:
      required: true
      example: date.heating_circuit_1_holiday_start
      selector:
        entity:
          integration: wemportal
          domain: date
    begin:
      required: true
      selector:
        date:
    end_entity:
      required: true
      example: date.heating_circuit_1_holiday_end
      selector:
        entity:
          integration: wemportal
          domain: date
    end:
      required: true
      selector:
        date:
