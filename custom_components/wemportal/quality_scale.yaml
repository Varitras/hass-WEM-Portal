# Where this integration stands against Home Assistant's Integration Quality
# Scale, rule by rule.
#
# Home Assistant only checks this file for integrations that live in core, and
# nothing here is shown in HACS or the UI. It is kept anyway, for two reasons
# that have nothing to do with a badge: a rule marked `todo` is a piece of work
# somebody can pick up without first rediscovering that it is missing, and a
# rule marked `exempt` records WHY it will stay that way - which is the part
# that otherwise gets re-litigated every year.
#
# The `docs-*` rules are written for pages on home-assistant.io, which a custom
# integration does not have. They are judged against README.md instead, section
# for section, rather than declared exempt: the user needs the information
# either way.
#
# Status values are Home Assistant's own: done, exempt (with a comment saying
# why), todo.

rules:
  # Bronze
  action-setup:
    status: todo
    comment: >-
      Both actions are registered in async_setup_entry rather than async_setup.
      They need a loaded entry to do anything - the expert write needs the
      portal client, the holiday service needs the coordinator - so registering
      them earlier would only move the "no entry" error from the call to the
      lookup. The rule wants them registered once at startup and validated at
      call time, which is a rework of the lookup, not of the registration.
  appropriate-polling: done
  brands:
    status: exempt
    comment: >-
      A custom integration has no entry in the home-assistant/brands
      repository, and no way to get one while it stays outside core.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: todo
    comment: >-
      The rule asks for above 95% over the integration; measured is 91% across
      4503 statements. Almost all of the gap is expert_writer.py at 69%, the
      web-scraping client for expert parameters - its error branches need
      portal HTML nobody has captured yet. Every other module is at 85% or
      better, most above 94%.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Nothing to update - see discovery.
  discovery:
    status: exempt
    comment: >-
      The installation is reached through a cloud account behind a login. There
      is nothing on the network to find, and no local device to announce
      itself.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: todo
    comment: >-
      Every reading the portal offers becomes an enabled entity, and a full
      installation reports a great many. Nothing is currently disabled by
      default, and deciding which readings are the noisy ones needs data from
      more than one installation.
  entity-translations:
    status: todo
    comment: >-
      Entity names are built at runtime from what the portal reports - the API
      side through a parameter-id mapper and an in-repository translator, the
      scraped side from the heading and row text of the web interface. A
      translation key needs a closed set of names known in advance, and this
      set is open and installation-specific. It is also not only a display
      string: the mapper compares the words of a name when it merges an API row
      with a scraped one, and the migration rebuilds old unique ids from it.
      Moving to translation keys is therefore a rework of two invariants and a
      visible rename for every user, not a presentation change.
  exception-translations: done
  icon-translations:
    status: todo
    comment: >-
      An icons.json entry only resolves through a translation key, so this rule
      cannot be met ahead of entity-translations. The one icon set in code
      belongs to the expert numbers; the rest are left to the device class on
      purpose, because an explicit icon always beats it.
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: >-
      The portal enforces TLS fingerprinting, which is what curl_cffi is here
      for; lxml parses the scraped pages. Both are blocking and have no async
      equivalent that would still get past the fingerprint check. Every call
      runs in an executor job, which satisfies no-blocking-calls but not this
      rule.
  inject-websession:
    status: exempt
    comment: >-
      No aiohttp or httpx session exists to inject - see async-dependency.
  strict-typing: done
