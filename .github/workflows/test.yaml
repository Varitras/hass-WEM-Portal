name: Test

on:
  push:
  pull_request:

# Minimal GITHUB_TOKEN scope: this workflow only checks out and runs tests,
# so read access to the repo contents is all it needs. Limiting the token
# is a supply-chain hardening best practice (flagged by CodeQL otherwise).
permissions:
  contents: read

jobs:
  lint:
    # Its own job, not a step of the test matrix: a formatting complaint and a
    # failing test are different news, and a red cross that could mean either
    # gets read as neither.
    name: ruff
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      # Pinned. An unpinned install means the CI enforces whatever Ruff
      # decided this week, and a release that reflows differently would fail
      # a build nobody changed - which is exactly the drift ruff.toml exists
      # to stop, let back in through the other door.
      - name: Install Ruff
        run: pip install "ruff==0.15.22"
      - name: Lint
        run: ruff check .
      # The formatting only stays put if something checks it. It was applied
      # once by hand; without this it survives until the first commit written
      # in a different editor.
      - name: Check formatting
        run: ruff format --check .

  mypy:
    # The guard on the typed data model (rebuild phase 3): types without a
    # checker rot. Scope lives in mypy.ini and grows with the rebuild -
    # widening it is part of each phase's definition of done.
    name: mypy
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      # Home Assistant has to be importable for the checked modules' own
      # imports; the test requirements bring a matching release. Mypy is
      # pinned for the same reason Ruff is: an unpinned checker fails builds
      # nobody changed.
      - name: Install dependencies
        run: |
          pip install -r requirements_test.txt
          pip install "mypy==2.3.0"
      - name: Type check
        run: mypy

  pytest:
    # Two ends of the supported range, because they catch opposite mistakes.
    #
    # "minimum" catches using an API that does not exist yet on the version
    # hacs.json declares. That is not hypothetical: the options flow relies on
    # OptionsFlow.config_entry, which only appeared in 2024.12 - while the
    # manifest still claimed 2024.11 support. A single current-version job
    # cannot see that class of bug at all.
    #
    # "current" catches the opposite: an API that has since been REMOVED.
    # Its plugin version is resolved at run time to the newest release that
    # pins a FINAL Home Assistant - see .github/scripts/resolve_phcc.py for
    # why an unpinned install silently tested a beta instead.
    name: pytest (${{ matrix.name }})
    runs-on: "ubuntu-latest"
    strategy:
      # Both results matter; a failure at one end must not hide the other.
      fail-fast: false
      matrix:
        include:
          - name: "minimum HA 2024.12"
            python-version: "3.12"
            # This job is the one with a version it MUST be running; the
            # current job has no fixed expectation to check against.
            check-declared-minimum: true
            # Pinned to the plugin release that ships exactly the Home
            # Assistant version hacs.json declares as the minimum. Raise both
            # together, never one alone.
            phcc: "pytest-homeassistant-custom-component==0.13.190"
          - name: "current HA"
            python-version: "3.14"
            # Resolved by the step below, not a literal requirement.
            phcc: "latest-stable-ha"
    steps:
      - uses: "actions/checkout@v7"
      - name: Set up Python
        uses: "actions/setup-python@v7"
        with:
          python-version: ${{ matrix.python-version }}
      - name: Resolve the plugin version to install
        # tee, not a plain redirect: the chosen version has to be visible in
        # the log too, or a job that disagrees with a local run is guesswork.
        run: python .github/scripts/resolve_phcc.py "${{ matrix.phcc }}" | tee -a "$GITHUB_ENV"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest-timeout by name: these jobs deliberately do not install
          # requirements_test.txt, so nothing else here would bring it - and
          # the timeout that stops a hung run is exactly what must not depend
          # on some other package still happening to pull it in.
          pip install "$PHCC_SPEC" pytest-timeout -r requirements_runtime.txt
      - name: Show the Home Assistant version under test
        run: python -c "from homeassistant.const import __version__; print(__version__)"
      - name: The minimum job must run the version hacs.json declares
        if: matrix.check-declared-minimum
        run: python .github/scripts/check_min_ha.py
      # -m "" cancels the `-m "not e2e"` default from pytest.ini, so the slow
      # end-to-end tests against a real Home Assistant run here. Without it
      # the marker would become a silent coverage gap.
      - name: Run test suite
        run: pytest tests/ -q -m ""
      # A green suite says the tests pass, not that they would catch anything.
      # Every worthless test written here so far was green while the feature
      # was broken, and every one was found by breaking the code on purpose
      # rather than by reading the test. Only on one job: the answer does not
      # depend on the Home Assistant version, and the mutations edit files in
      # the workspace, so running it twice in parallel would be unsound.
      - name: Verify the tests actually catch a broken fix
        if: matrix.name == 'current HA'
        run: python .github/scripts/mutate.py .github/mutations/response-gate.json
