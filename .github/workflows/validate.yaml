name: Validate

on:
  push:
  pull_request:

# Minimal GITHUB_TOKEN scope: HACS validation only reads the repo. Limiting
# the token is a supply-chain hardening best practice (flagged by CodeQL
# otherwise).
permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
      - name: HACS validation
        # Pinned to a commit SHA so the action DEFINITION cannot change under
        # us; hacs/action main as of 2026-07-08, bump deliberately when
        # needed. Note this is not full immutability: the pinned definition
        # runs ghcr.io/hacs/action:main, a mutable image tag, so the code
        # that actually executes can still change without this SHA moving.
        uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa"
        with:
          category: "integration"
