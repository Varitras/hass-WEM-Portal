[pytest]
# Put the repo root on sys.path so tests can import the integration as
# `custom_components.wemportal.<module>` (custom_components is a namespace
# package - no __init__.py - so the root must be importable).
pythonpath = .
# pytest-homeassistant-custom-component uses asyncio; auto mode lets async
# tests run without a per-test marker (the current suite is sync, but this
# keeps future hass-based tests simple and matches the HA convention).
asyncio_mode = auto
# Stated rather than inherited. pytest-asyncio warns that leaving it unset is
# deprecated because the default is going to change, and `function` is both
# the value it will change to and what this suite already relies on - every
# async fixture here belongs to the test that uses it. Only the older
# pytest-asyncio in the minimum-Home-Assistant environment raises the warning
# today, which is why a run against the current one alone does not show it.
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The e2e tests spin up a real Home Assistant instance per test (~seconds
# each), so they are deselected by default for a fast everyday run. CI runs
# the full suite with `-m ""`, which cancels this deselection.
addopts = -m "not e2e"
# The other half of the duration budget in tests/durations.py, and it has to
# be a different mechanism: that one measures a test AFTER it returns, so a
# deadlock or a patch that landed on the wrong name never reaches it and the
# job runs to whatever limit CI enforces. This one cuts the run off.
# Deliberately far above the 30-second budget rather than equal to it: as a
# report, 30s means "look at this"; as a kill, the same number would fail the
# suite on a slow runner. `thread` because the waits this exists for are in
# worker threads, where the default signal method never fires.
timeout = 300
timeout_method = thread
markers =
    e2e: full end-to-end test against a real Home Assistant setup (slow)
