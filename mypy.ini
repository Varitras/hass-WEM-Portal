# Type checking, introduced with the typed data model (rebuild phase 3).
#
# Scope grows with the rebuild: strict on the modules that carry the typed
# model, silent on everything they import. Widening the file list is part of
# each phase's definition of done - not a separate chore that can slip.
[mypy]
files =
    custom_components/wemportal/models.py,
    custom_components/wemportal/mobile_protocol.py,
    custom_components/wemportal/exceptions.py,
    custom_components/wemportal/diagnostics.py,
    custom_components/wemportal/entity.py,
    custom_components/wemportal/sensor.py,
    custom_components/wemportal/number.py,
    custom_components/wemportal/select.py,
    custom_components/wemportal/switch.py,
    custom_components/wemportal/date.py
strict = True
# Followed imports are used for inference but not reported: the unlisted
# modules are not typed yet, and drowning the signal in their noise is how
# a checker gets turned off again.
follow_imports = silent

# The platform modules are checked for what matters there - that every
# Reading field access exists and type-checks - without demanding an
# annotation on every schedule-rendering helper. Strict stays on the model
# modules above, which is where the types are DEFINED.
[mypy-wemportal.entity]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-wemportal.sensor]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-wemportal.number]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-wemportal.select]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-wemportal.switch]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-wemportal.date]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False

[mypy-curl_cffi.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True
